[project]
name = "apim-backend-pool-tui"
version = "0.2.1"
description = "Terminal UI for the APIM Backend Pool Manager; a client of the backend's /api"
requires-python = ">=3.11"
dependencies = [
    "textual==8.2.8",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The tests drive the real backend (with its in-memory APIM) through httpx.ASGITransport.
pythonpath = [".", "../backend"]
testpaths = ["tests"]
log_level = "WARNING"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pool_tui"]
